<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distance from University</title>
    <link rel="stylesheet" href="Change-style.css">

    <script>
        // Coordinates for Kasem Bundit University (Pattanakarn Campus)
        const uniLat = 13.7384;
        const uniLon = 100.6279;

        function calculateDistance() {
            let output = document.getElementById("result");
            output.innerHTML = "Locating your position...";

            // 1. Check if the Geolocation API is supported by the browser
            if (navigator.geolocation) {
                
                // 2. Get the browser's current coordinates
                navigator.geolocation.getCurrentPosition(function(position) {
                    
                    let userLat = position.coords.latitude;
                    let userLon = position.coords.longitude;

                    // 3. Calculate differences for X and Y
                    let x = userLat - uniLat;
                    let y = userLon - uniLon;

                    // 4. Apply Euclidean formula: Distance = sqrt(x^2 + y^2)
                    let distance = Math.sqrt(Math.pow(x, 2) + Math.pow(y, 2));

                    // 5. Output the results to the LCD screen
                    output.innerHTML = 
                        "<strong>KBU Coords:</strong> " + uniLat.toFixed(4) + ", " + uniLon.toFixed(4) + "<br>" +
                        "<strong>Your Coords:</strong> " + userLat.toFixed(4) + ", " + userLon.toFixed(4) + "<br>" +
                        "<strong>Distance: " + distance.toFixed(4) + " units</strong>";

                }, function(error) {
                    // Error handling if location permission is denied
                    output.innerHTML = "Location Error: " + error.message;
                });
            } else {
                output.innerHTML = "Geolocation is not supported by this browser.";
            }
        }

        // BOM History function for the Back button with fallback
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = "index.html";
            }
        }
    </script>
</head>
<body>

    <div class="calculator">
        <div class="brand"><span><span class="dot"></span>JS LAB · MODEL 100</span><span>DISTANCE</span></div>

        <h2>How far from University?</h2>

        <div class="screen" id="result">Click button below to find distance from KBU.</div>

        <div class="keys">
            <button class="key key--accent" onclick="calculateDistance()">Get Distance</button>
            <button class="key" onclick="goBack()">Back</button>
        </div>
    </div>

</body>
</html>
