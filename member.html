<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member List - Local Storage Lab</title>
    <link rel="stylesheet" href="Change-style.css">
    <style>
        .calculator {
            max-width: 460px;
        }

        .member-list-box {
            background: var(--screen-bg);
            border: 1px solid #a9b394;
            border-radius: 8px;
            padding: 12px;
            min-height: 120px;
            max-height: 240px;
            overflow-y: auto;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.15);
            font-family: 'Share Tech Mono', monospace;
            color: var(--screen-ink);
        }

        .member-list-box:empty::before {
            content: "No members in local storage.";
            display: block;
            text-align: center;
            opacity: 0.5;
            padding: 30px 0;
            font-size: 0.9rem;
        }

        .member-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.45);
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 0.95rem;
            transition: background 0.15s ease;
        }

        .member-item:hover {
            background: rgba(255, 255, 255, 0.8);
        }

        .member-name {
            display: flex;
            align-items: center;
            gap: 8px;
            word-break: break-all;
        }

        .btn-delete-item {
            background: #d9534f;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 3px 8px;
            font-size: 0.75rem;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s ease;
        }

        .btn-delete-item:hover {
            opacity: 0.85;
        }

        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }

        .count-badge {
            display: inline-block;
            background: var(--accent);
            color: white;
            padding: 2px 8px;
            border-radius: 99px;
            font-size: 0.72rem;
            font-family: 'Inter', sans-serif;
            margin-left: 6px;
        }
    </style>
</head>
<body>

<div class="calculator">
    <div class="brand">
        <span><span class="dot"></span>JS LAB · MODEL 100</span>
        <span>LOCAL STORAGE</span>
    </div>

    <h1>Member List</h1>

    <!-- LCD Status Screen -->
    <div class="screen" id="result">
        Local Storage Active. Ready to manage members.
    </div>

    <!-- Input for Member Name -->
    <div class="field">
        <label for="memberName">Enter Member Name</label>
        <input 
            type="text" 
            id="memberName" 
            placeholder="e.g. Han Win Htun" 
            onkeyup="if(event.key==='Enter') AddMember()"
            autocomplete="off"
        >
    </div>

    <!-- Add and Remove Buttons -->
    <div class="action-row">
        <button type="button" class="key key--accent" onclick="AddMember()">Add Member</button>
        <button type="button" class="key" style="background: #991b1b;" onclick="RemoveMember()">Remove Member</button>
    </div>

    <!-- List Display Container -->
    <div class="field">
        <label>
            Stored Members <span class="count-badge" id="memberCount">0</span>
        </label>
        <div id="memberListContainer" class="member-list-box"></div>
    </div>

    <!-- Secondary Controls -->
    <div class="keys" style="margin-top: 16px;">
        <button type="button" class="key" onclick="ClearAllMembers()">Clear All</button>
        <button type="button" class="key" onclick="goBack()">Back</button>
    </div>
</div>

<script>
    const STORAGE_KEY = "memberList";

    // 1. Function to Display the Member List from localStorage
    function DisplayMemberList() {
        const rawData = localStorage.getItem(STORAGE_KEY);
        const members = rawData ? JSON.parse(rawData) : [];
        const container = document.getElementById("memberListContainer");
        const countBadge = document.getElementById("memberCount");

        // Clear existing list elements
        container.innerHTML = "";
        countBadge.textContent = members.length;

        // Render each member in the list
        members.forEach((member, index) => {
            const item = document.createElement("div");
            item.className = "member-item";

            const nameSpan = document.createElement("span");
            nameSpan.className = "member-name";
            nameSpan.innerHTML = `<strong>${index + 1}.</strong> ${escapeHTML(member)}`;

            const removeBtn = document.createElement("button");
            removeBtn.className = "btn-delete-item";
            removeBtn.textContent = "✕";
            removeBtn.title = "Remove this member";
            removeBtn.onclick = function() {
                RemoveMemberByIndex(index);
            };

            item.appendChild(nameSpan);
            item.appendChild(removeBtn);
            container.appendChild(item);
        });
    }

    // 2. Function to Add Member to localStorage
    function AddMember() {
        const input = document.getElementById("memberName");
        const name = input.value.trim();
        const statusScreen = document.getElementById("result");

        // Validation: Empty name check
        if (name === "") {
            statusScreen.innerHTML = "Validation Error: Please enter a member name.";
            input.focus();
            return;
        }

        // Retrieve existing members from localStorage
        const rawData = localStorage.getItem(STORAGE_KEY);
        let members = rawData ? JSON.parse(rawData) : [];

        // Add new member to array
        members.push(name);

        // Save updated array back to localStorage
        localStorage.setItem(STORAGE_KEY, JSON.stringify(members));

        // Clear input field and notify user
        input.value = "";
        statusScreen.innerHTML = `Added member: <strong>${escapeHTML(name)}</strong><br>Saved to Local Storage.`;

        // Explicit Requirement: Call DisplayMemberList one more time!
        DisplayMemberList();
    }

    // 3. Function to Remove Member from localStorage (by input name or last member)
    function RemoveMember() {
        const input = document.getElementById("memberName");
        const name = input.value.trim();
        const statusScreen = document.getElementById("result");

        const rawData = localStorage.getItem(STORAGE_KEY);
        let members = rawData ? JSON.parse(rawData) : [];

        if (members.length === 0) {
            statusScreen.innerHTML = "Error: Local Storage is already empty.";
            return;
        }

        let removedName = "";

        if (name !== "") {
            // Remove by specified name in input
            const index = members.findIndex(m => m.toLowerCase() === name.toLowerCase());
            if (index !== -1) {
                removedName = members.splice(index, 1)[0];
                input.value = "";
            } else {
                statusScreen.innerHTML = `Error: Member <strong>${escapeHTML(name)}</strong> not found.`;
                return;
            }
        } else {
            // If input is empty, remove the most recent member
            removedName = members.pop();
        }

        // Save updated array back to localStorage
        localStorage.setItem(STORAGE_KEY, JSON.stringify(members));

        statusScreen.innerHTML = `Removed member: <strong>${escapeHTML(removedName)}</strong><br>Updated in Local Storage.`;

        // Explicit Requirement: Call DisplayMemberList one more time!
        DisplayMemberList();
    }

    // Remove specific member by index from list button
    function RemoveMemberByIndex(index) {
        const rawData = localStorage.getItem(STORAGE_KEY);
        let members = rawData ? JSON.parse(rawData) : [];

        if (index >= 0 && index < members.length) {
            const removed = members.splice(index, 1)[0];
            localStorage.setItem(STORAGE_KEY, JSON.stringify(members));
            document.getElementById("result").innerHTML = `Removed: <strong>${escapeHTML(removed)}</strong> from list.`;
            
            // Explicit Requirement: Call DisplayMemberList one more time!
            DisplayMemberList();
        }
    }

    // Optional: Clear all members
    function ClearAllMembers() {
        if (confirm("Clear all members from Local Storage?")) {
            localStorage.removeItem(STORAGE_KEY);
            document.getElementById("result").innerHTML = "All members cleared from Local Storage.";
            DisplayMemberList();
        }
    }

    // Helper: Prevent XSS
    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag)
        );
    }

    // BOM Back function with fallback to index.html
    function goBack() {
        if (window.history.length > 1) {
            window.history.back();
        } else {
            window.location.href = "index.html";
        }
    }

    // Initial call when page loads
    window.onload = function() {
        DisplayMemberList();
    };
</script>

</body>
</html>
