<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculate Grade</title>
    <link rel="stylesheet" href="Change-style.css">

    <script>
        function calculateGrade() {
            let rawScore = document.getElementById("score").value.trim();

            // Validation 1: Check for empty input
            if (rawScore === "") {
                document.getElementById("result").innerHTML = "Please enter your score.";
                return;
            }

            let score = Number(rawScore);

            // Validation 2: Check for valid number
            if (isNaN(score)) {
                document.getElementById("result").innerHTML = "Please enter a valid numeric score.";
                return;
            }

            let grade = "";

            // Validation 3: Check for out-of-bounds scores
            if (score < 0 || score > 100) {
                grade = "Invalid Score";
            } 
            else if (score >= 80) {
                grade = "A";
            } 
            else if (score >= 70) {
                grade = "B";
            } 
            else if (score >= 60) {
                grade = "C";
            } 
            else if (score >= 50) {
                grade = "D";
            } 
            else {
                grade = "F"; 
            }

            // Output the final result to the LCD screen
            if (grade === "Invalid Score") {
                document.getElementById("result").innerHTML = "Please enter a valid score between 0 and 100.";
            } else {
                document.getElementById("result").innerHTML = "You got Grade " + grade;
            }
        }

        // BOM Back function with fallback
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = "index.html";
            }
        }
    </script>
</head>

<body>

<div class="calculator">
    <div class="brand"><span><span class="dot"></span>JS LAB · MODEL 100</span><span>GRADE</span></div>

    <h1>Calculate Grade</h1>

    <div class="screen" id="result"></div>

    <div class="field">
        <label for="score">Enter your score (0 - 100)</label>
        <input type="number" id="score" placeholder="e.g. 85" onkeyup="if(event.key==='Enter') calculateGrade()">
    </div>

    <div class="keys">
        <button class="key key--accent" onclick="calculateGrade()">Submit</button>
        <button class="key" onclick="goBack()">Back</button>
    </div>
</div>

</body>
</html>
