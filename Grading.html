<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculate Grade</title>
    <link rel="stylesheet" href="Change-style.css">

    <script>
        function calculateGrade() {
            // Retrieve the input and convert it to a number
            let score = Number(document.getElementById("score").value);
            let grade = "";

            // Check for out-of-bounds scores first
            if (score < 0 || score > 100) {
                grade = "Invalid Score";
            } 
            else if (score >= 80) {
                grade = "A";
            } 
            else if (score >= 70) {
                grade = "B";
            } 
            else if (score >= 60) {
                grade = "C";
            } 
            else if (score >= 50) {
                grade = "D";
            } 
            else {
                // If it's valid and below 50, it must be an F
                grade = "F"; 
            }

            // Output the final result to the HTML paragraph
            if (grade === "Invalid Score") {
                document.getElementById("result").innerHTML = "Please enter a valid score between 0 and 100.";
            } else {
                document.getElementById("result").innerHTML = "You got Grade " + grade;
            }
        }
    </script>

</head>

<body>

<div class="calculator">
    <div class="brand"><span><span class="dot"></span>JS LAB · MODEL 100</span><span>GRADE</span></div>

    <h1>Calculate Grade</h1>

    <div class="screen" id="result"></div>

    <div class="field">
        <label for="score">Enter your score</label>
        <input type="number" id="score">
    </div>

    <div class="keys">
        <button class="key key--accent" onclick="calculateGrade()">Submit</button>
    </div>
</div>

</body>
</html>
