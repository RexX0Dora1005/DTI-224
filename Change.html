<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculate Change</title>
    <link rel="stylesheet" href="Change-style.css">

    <script>
        function calculateChange() {
            let rawAmount = document.getElementById("amount").value.trim();

            // Validation 1: Check for empty input
            if (rawAmount === "") {
                document.getElementById("result").innerHTML = "Please enter an amount.";
                return;
            }

            let amount = Number(rawAmount);

            // Validation 2: Ensure the amount is a valid positive whole number
            if (isNaN(amount) || amount <= 0 || !Number.isInteger(amount)) {
                document.getElementById("result").innerHTML = "Please enter a valid positive whole number.";
                return;
            }

            let resultText = "";

            // Array of objects representing the denominations (Thai Baht ฿ / Standard)
            const denominations = [
                { value: 1000, name: "฿1000 note" },
                { value: 500, name: "฿500 note" },
                { value: 100, name: "฿100 note" },
                { value: 50, name: "฿50 note" },
                { value: 20, name: "฿20 note" },
                { value: 10, name: "฿10 coin" },
                { value: 5, name: "฿5 coin" },
                { value: 2, name: "฿2 coin" },
                { value: 1, name: "฿1 coin" }
            ];

            // Loop through all denominations
            for (let denom of denominations) {
                let count = Math.floor(amount / denom.value);
                
                // Display non-zero denominations (matching slide example)
                if (count > 0) {
                    resultText += count + " of " + denom.name + "<br>";
                }
                
                amount = amount % denom.value;
            }

            // Output the final result to the LCD screen
            document.getElementById("result").innerHTML = resultText || "฿0";
        }

        // BOM Back function with fallback
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = "index.html";
            }
        }
    </script>
</head>

<body>

    <div class="calculator">
        <div class="brand"><span><span class="dot"></span>JS LAB · MODEL 100</span><span>CHANGE</span></div>

        <h2>Calculate Change</h2>

        <div class="screen" id="result"></div>

        <div class="field">
            <label for="amount">Enter Amount (฿)</label>
            <input type="number" id="amount" placeholder="e.g. 874" min="1" step="1" onkeyup="if(event.key==='Enter') calculateChange()">
        </div>

        <div class="keys">
            <button class="key key--accent" onclick="calculateChange()">Submit</button>
            <button class="key" onclick="goBack()">Back</button>
        </div>
    </div>

</body>
</html>
